<!doctype html>
<html lang="vi" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Báo Cáo & Góp Ý | TKB Tools</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <script>
      (function () {
        const osPrefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const savedTheme =
          localStorage.getItem("selected-theme-mode") ||
          (osPrefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>

    <header class="top-bar">
      <div class="top-bar-actions">
        <a href="../" class="btn btn-secondary btn-small"
          >← Quay lại trang chủ</a
        >
      </div>
      <div class="segmented-control">
        <input
          type="radio"
          name="theme-select"
          id="theme-light"
          value="light"
        />
        <label for="theme-light" title="Giao diện sáng">☀️</label>
        <input type="radio" name="theme-select" id="theme-dark" value="dark" />
        <label for="theme-dark" title="Giao diện tối">🌙</label>
        <div class="glider"></div>
      </div>
    </header>

    <main class="container">
      <div class="brand-zone">
        <h1 class="main-title">GỬI GÓP Ý & BÁO LỖI</h1>
        <p class="sub-title">
          Cảm ơn bạn đã giúp TKB Tools ngày càng hoàn thiện hơn!
        </p>
      </div>

      <section class="card">
        <form id="feedbackForm" class="feedback-form">
          <div class="form-group">
            <label class="form-label" for="fbName"
              >Họ và tên <span class="text-danger">*</span></label
            >
            <input
              type="text"
              id="fbName"
              class="form-control"
              placeholder="Nhập tên của bạn"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="fbEmail"
              >Email liên hệ <span class="text-danger">*</span></label
            >
            <input
              type="email"
              id="fbEmail"
              class="form-control"
              placeholder="Nhập email của bạn"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="fbType"
              >Bạn muốn gửi gì? <span class="text-danger">*</span></label
            >
            <select id="fbType" class="form-control" required>
              <option value="" disabled selected>-- Chọn một loại --</option>
              <option value="Báo cáo lỗi">
                🐛 Báo cáo lỗi (Lỗi web, TKB trích xuất sai...)
              </option>
              <option value="Góp ý phát triển">
                💡 Góp ý phát triển tính năng
              </option>
              <option value="Khác">💬 Vấn đề khác</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="fbDesc"
              >Mô tả chi tiết <span class="text-danger">*</span></label
            >
            <textarea
              id="fbDesc"
              class="form-control modern-textarea"
              style="height: 150px"
              placeholder="Mô tả lỗi hoặc ý tưởng của bạn một cách chi tiết..."
              required
            ></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="fbFiles">
              Đính kèm hình ảnh / video (Không bắt buộc)
              <br /><small
                style="font-weight: normal; color: var(--text-secondary)"
                >Tối đa 5 file. Mỗi file tối đa 10MB.</small
              >
            </label>
            <input
              type="file"
              id="fbFiles"
              class="form-control"
              accept="image/*,video/*"
              multiple
            />
            <p
              id="fileError"
              class="text-danger hidden"
              style="margin-top: 5px; font-size: 13px; font-weight: bold"
            ></p>
          </div>

          <div id="submitContainer" class="text-center mt-24">
            <button
              type="submit"
              id="submitFbBtn"
              class="btn btn-primary"
              style="width: 100%"
            >
              🚀 Gửi Phản Hồi
            </button>
          </div>

          <div id="loadingBox" class="loading-box hidden">
            <div class="loading-content">
              <div class="spinner"></div>
              <div class="loading-text">
                <p class="loading-main">Đang tải dữ liệu lên...</p>
                <p class="loading-sub">Vui lòng không đóng trang này!</p>
              </div>
            </div>
          </div>

          <div
            id="successBox"
            class="hidden"
            style="text-align: center; margin-top: 20px"
          >
            <span
              class="status-badge"
              style="background-color: var(--success-color); color: white"
              >✓ Đã gửi phản hồi thành công! Cảm ơn bạn.</span
            >
            <div style="margin-top: 20px">
              <button
                type="button"
                class="btn btn-secondary"
                onclick="window.location.reload()"
              >
                Gửi phản hồi khác
              </button>
            </div>
          </div>
        </form>
      </section>
    </main>

    <script src="feedback_scripts.js"></script>
  </body>
</html>
