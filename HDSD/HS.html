<!doctype html>
<html lang="vi" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hướng Dẫn Sử Dụng - Bản Giáo Viên | Công cụ Xử lý TKB</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
    <script src="guide.js"></script>
    <script>
      if (window.location.pathname.endsWith(".html")) {
        const cleanUrl = window.location.pathname.slice(0, -5);
        window.history.replaceState(
          null,
          "",
          cleanUrl + window.location.search + window.location.hash,
        );
      }
    </script>
  </head>
  <body>
    <script>
      (function () {
        const osPrefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const savedTheme =
          localStorage.getItem("selected-theme-mode") ||
          (osPrefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>

    <button id="backBtn" class="btn btn-secondary guide-back-btn">
      ← Trở lại
    </button>

    <main class="container">
      <div class="brand-zone" style="margin: 0 auto; text-align: center">
        <h1>HƯỚNG DẪN SỬ DỤNG ĐANG CẬP NHẬT VÀ HIỆN KHÔNG CÓ SẴN</h1>
      </div>
    </main>

    <script>
      document.getElementById("backBtn").addEventListener("click", () => {
        window.close();
        setTimeout(() => {
          alert("Vui lòng đóng tab này để quay lại trang chính.");
        }, 300);
      });
    </script>
  </body>
</html>
